# CI workflow for alliance-tracker
#
# Integration tests provision their own local D1 via @cloudflare/vitest-pool-workers
# (no Cloudflare credentials needed).

name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - run: npx tsc --noEmit

      - run: npm test

      - run: npm --prefix web ci

      - run: npm --prefix web run lint

      - run: npm run build:web
